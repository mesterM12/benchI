<!doctype html>
<!-- Three variants of benchI's dashboard information architecture, switchable via ?variant=A|B|C. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>benchI dashboard IA prototype</title>
  <style>
    :root { color-scheme: dark; --bg:#0b0e13; --panel:#121722; --line:#283142; --muted:#8f9bad; --text:#edf1f7; --lime:#b8f34a; --blue:#6ea8fe; --amber:#ffbd59; --red:#ff6b6b; }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace } button { font:inherit; cursor:pointer }
    a { color:inherit; text-decoration:none } h1,h2,h3,p { margin-top:0 } h1 { font-size:24px } h2 { font-size:16px } h3 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em }
    .brand { font-weight:800; letter-spacing:-.06em; font-size:20px }.brand i { color:var(--lime); font-style:normal }.muted { color:var(--muted) }.ok { color:var(--lime) }.warn { color:var(--amber) }.bad { color:var(--red) }
    .pill { display:inline-flex; gap:6px; align-items:center; border:1px solid var(--line); border-radius:99px; padding:4px 9px; font-size:12px }.dot { width:7px; height:7px; border-radius:50%; background:currentColor }
    .btn { border:1px solid var(--line); background:#1a2230; color:var(--text); border-radius:6px; padding:8px 12px }.btn.primary { background:var(--lime); color:#111; border-color:var(--lime); font-weight:700 }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px }.row { display:flex; align-items:center; justify-content:space-between; gap:12px }.stack { display:grid; gap:12px }
    .bar { height:6px; border-radius:9px; overflow:hidden; background:#242c39 }.bar span { height:100%; display:block; background:var(--lime) }
    table { width:100%; border-collapse:collapse } th,td { padding:10px 8px; border-bottom:1px solid var(--line); text-align:left } th { color:var(--muted); font-weight:500 }
    .switcher { position:fixed; z-index:30; left:50%; bottom:16px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; padding:7px; border-radius:999px; background:#f5f7fa; color:#111; box-shadow:0 8px 36px #000a }
    .switcher button { width:34px; height:34px; border:0; border-radius:50%; background:#dfe4ea }.switcher strong { min-width:210px; text-align:center }.variant { min-height:100vh; padding-bottom:80px }
    /* A: resource navigation */
    .a { display:grid; grid-template-columns:220px 1fr }.a aside { min-height:100vh; border-right:1px solid var(--line); padding:22px 14px; position:sticky; top:0; height:100vh }.a nav { display:grid; gap:4px; margin-top:28px }.a nav a { padding:9px 10px; border-radius:5px; color:var(--muted) }.a nav a.active { color:var(--text); background:#1a2230 }.a main { padding:26px 32px; max-width:1260px }.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:20px 0 }.metric b { display:block; font-size:25px; margin-top:8px }.split { display:grid; grid-template-columns:1.5fr 1fr; gap:12px }
    /* B: operations cockpit */
    .b header { height:58px; border-bottom:1px solid var(--line); padding:0 20px; display:flex; align-items:center; justify-content:space-between }.cockpit { padding:18px; display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:14px }.lane { border-left:2px solid var(--line); padding-left:15px }.lane + .lane { margin-top:18px }.run { display:grid; grid-template-columns:140px 1fr 100px; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line) }.alert { border-left:3px solid var(--amber); padding:11px 12px; background:#241d13 }.health { display:grid; grid-template-columns:1fr 1fr; gap:8px }.health .card { padding:12px }
    /* C: workflow home */
    .c { max-width:1120px; margin:auto; padding:28px }.c header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px }.actions { display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px }.action { min-height:145px; display:flex; flex-direction:column; justify-content:space-between }.action:first-child { background:var(--lime); color:#111; border-color:var(--lime) }.timeline { display:grid; grid-template-columns:repeat(5,1fr); gap:0; margin:24px 0 }.step { border-top:2px solid var(--line); padding:12px 10px }.step.active { border-color:var(--lime) }.library { display:grid; grid-template-columns:repeat(3,1fr); gap:12px }
    @media(max-width:800px){ .a { grid-template-columns:1fr }.a aside { min-height:auto; height:auto; position:static; border-right:0; border-bottom:1px solid var(--line) }.a nav { grid-template-columns:repeat(3,1fr); overflow:auto }.a main,.c { padding:18px }.stats,.split,.actions,.library,.cockpit { grid-template-columns:1fr }.cockpit { padding:12px }.timeline { overflow:auto }.step { min-width:150px }.run { grid-template-columns:1fr }.switcher strong { min-width:150px } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="switcher" aria-label="Prototype variant switcher"><button id="prev" aria-label="Previous variant">←</button><strong id="label"></strong><button id="next" aria-label="Next variant">→</button></div>
  <template id="A"><div class="variant a"><aside><div class="brand">bench<i>I</i></div><nav><a class="active">Overview</a><a>Eval Suites</a><a>Eval Runs</a><a>Submitted Trials</a><a>Artifacts & exports</a><a>Execution Resources</a><a>Installation</a></nav><div style="position:absolute;bottom:24px" class="pill ok"><span class="dot"></span> Installation ready</div></aside><main><div class="row"><div><h1>Good morning, Admin</h1><p class="muted">Organization overview · last updated just now</p></div><button class="btn primary">Launch eval run</button></div><section class="stats"><div class="card metric"><span class="muted">Active trials</span><b>24</b><span class="ok">18 running</span></div><div class="card metric"><span class="muted">Scoring complete</span><b>92%</b><span class="warn">6 pending</span></div><div class="card metric"><span class="muted">Runtime eligibility</span><b>8 / 9</b><span class="warn">1 blocked</span></div><div class="card metric"><span class="muted">Retained storage</span><b>2.4 TB</b><span class="muted">71% allocated</span></div></section><div class="split"><section class="card"><div class="row"><h2>Recent eval runs</h2><a class="muted">View all →</a></div><table><tr><th>Eval run</th><th>Suite</th><th>Progress</th><th>Score</th></tr><tr><td>Agent regression · Aug 27</td><td>Core coding</td><td><span class="ok">Running 78%</span></td><td>—</td></tr><tr><td>Tool-use matrix · Aug 26</td><td>Tool reliability</td><td>Complete</td><td>0.84</td></tr><tr><td>Submitted baseline</td><td>Core coding</td><td><span class="warn">Scoring 91%</span></td><td>0.71*</td></tr></table></section><section class="stack"><div class="card"><h3>Needs attention</h3><p><span class="warn">●</span> 1 suite cannot launch on current workers</p><p><span class="bad">●</span> 2 artifacts awaiting visibility review</p><p><span class="warn">●</span> Deleting 118 GB affects rescorability</p></div><div class="card"><h3>Installation</h3><div class="row"><span>Control plane</span><span class="ok">Healthy</span></div><div class="row"><span>Workers</span><span>4 / 4</span></div><div class="row"><span>Backup</span><span class="ok">8h ago</span></div></div></section></div></main></div></template>
  <template id="B"><div class="variant b"><header><div class="brand">bench<i>I</i> <span class="muted">/ operations</span></div><div class="row"><span class="pill ok"><span class="dot"></span>4 workers</span><button class="btn primary">New eval run</button></div></header><div class="cockpit"><main><div class="row"><div><h1>Evaluation operations</h1><p class="muted">Live work first. Everything else is one level down.</p></div><div class="pill">24 active · 6 queued</div></div><section class="lane"><h3>Running now</h3><div class="run"><b>Regression 8/27</b><div><div class="row"><span>42 / 54 trials</span><span>78%</span></div><div class="bar"><span style="width:78%"></span></div></div><button class="btn">Inspect</button></div><div class="run"><b>Model sweep</b><div><div class="row"><span>12 / 36 trials</span><span>33%</span></div><div class="bar"><span style="width:33%"></span></div></div><button class="btn">Inspect</button></div></section><section class="lane"><h3>Scoring and submissions</h3><div class="run"><b>External baseline</b><div><span class="warn">3 scorer results missing · aggregate provisional</span></div><button class="btn">Resolve</button></div><div class="run"><b>Tool-use matrix</b><div><span class="ok">Complete · accepted · 0.84</span></div><button class="btn">Compare</button></div></section><section class="lane"><h3>Recently completed</h3><table><tr><td>Adapter conformance</td><td>18m ago</td><td class="ok">Complete</td></tr><tr><td>Prompt variants</td><td>2h ago</td><td class="bad">Rejected</td></tr></table></section></main><aside class="stack"><div class="alert"><b>Launch blocked</b><p class="muted">GPU suite requires a worker capability that is not currently eligible.</p><button class="btn">Review requirements</button></div><div class="card"><h3>Operator queue</h3><p>Approve <b>custom-codex@2.1</b> adapter</p><p>Review quarantined workspace artifact</p><p>Confirm deletion impact for 118 GB</p></div><div class="card"><h3>Installation health</h3><div class="health"><div class="card"><b class="ok">Healthy</b><br><span class="muted">API</span></div><div class="card"><b class="ok">Healthy</b><br><span class="muted">Jobs</span></div><div class="card"><b class="warn">1 warning</b><br><span class="muted">Storage</span></div><div class="card"><b class="ok">Verified</b><br><span class="muted">Backup</span></div></div><p class="muted">Diagnostics and release status →</p></div><div class="card"><h3>Quick access</h3><p>Eval Suites · Artifacts · Exports</p><p>Resources · Secrets · Storage</p></div></aside></div></div></template>
  <template id="C"><div class="variant c"><header><div class="brand">bench<i>I</i></div><div class="row"><button class="btn">Search ⌘K</button><span class="pill ok"><span class="dot"></span>Ready to evaluate</span></div></header><div><p class="muted">START HERE</p><h1>What do you want to evaluate?</h1></div><section class="actions"><button class="card action" style="text-align:left"><div><h2>Launch from an Eval Suite</h2><p>Validate sources, matrix, secrets, resources, and runtime eligibility before freezing.</p></div><b>Choose suite →</b></button><button class="card action" style="text-align:left"><div><h2>Author a suite</h2><p>Build the reusable evaluation definition.</p></div><b>Open workspace →</b></button><button class="card action" style="text-align:left"><div><h2>Submit trial output</h2><p>Score work produced outside benchI.</p></div><b>Start submission →</b></button></section><section class="timeline"><div class="step active"><b>1. Define</b><p class="muted">Eval Suite</p></div><div class="step active"><b>2. Validate</b><p class="muted">Launch readiness</p></div><div class="step active"><b>3. Observe</b><p class="muted">Trials and cancellation</p></div><div class="step"><b>4. Score</b><p class="muted">Completeness</p></div><div class="step"><b>5. Compare</b><p class="muted">Results and exports</p></div></section><div class="row"><h2>Continue your work</h2><span class="muted">See all activity →</span></div><section class="library"><div class="card"><h3>Running</h3><h2>Agent regression · Aug 27</h2><p class="ok">42 of 54 trials complete</p><div class="bar"><span style="width:78%"></span></div><p><button class="btn">Monitor or cancel</button></p></div><div class="card"><h3>Needs decision</h3><h2>Storage cleanup</h2><p class="warn">118 GB selected; 3 runs lose rescorability.</p><p><button class="btn">Review impact</button></p></div><div class="card"><h3>Draft</h3><h2>GPU agent matrix</h2><p class="bad">No eligible worker satisfies its runtime requirements.</p><p><button class="btn">Fix launch blockers</button></p></div></section><section class="card" style="margin-top:12px"><div class="row"><div><h3>Administration</h3><p style="margin:0">2 approvals · 1 quarantined artifact · storage warning</p></div><button class="btn">Open installation center</button></div></section></div></template>
  <script>
    const variants = { A: 'Resource navigator', B: 'Operations cockpit', C: 'Guided workflow' };
    let current = new URLSearchParams(location.search).get('variant')?.toUpperCase();
    if (!variants[current]) current = 'A';
    function render(key) { current = key; document.querySelector('#app').replaceChildren(document.querySelector(`#${key}`).content.cloneNode(true)); document.querySelector('#label').textContent = `${key} · ${variants[key]}`; const url = new URL(location); url.searchParams.set('variant', key); history.replaceState({}, '', url); }
    function cycle(delta) { const keys = Object.keys(variants); render(keys[(keys.indexOf(current) + delta + keys.length) % keys.length]); }
    document.querySelector('#prev').onclick = () => cycle(-1); document.querySelector('#next').onclick = () => cycle(1);
    addEventListener('keydown', event => { if (event.target.matches('input, textarea, [contenteditable]')) return; if (event.key === 'ArrowLeft') cycle(-1); if (event.key === 'ArrowRight') cycle(1); });
    render(current);
  </script>
</body>
</html>
